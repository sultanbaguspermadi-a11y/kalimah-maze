<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1d12" />
    <title>Kalimah Maze — Chronicles of the Lost Bazaar</title>
    <style>
      :root { color-scheme: dark; --bg: #2b1d12; --fg: #f4e6c8; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
      body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; font-family: system-ui, sans-serif; }
      #stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
      #fatal { position: fixed; inset: 0; display: none; place-items: center; background: #1a110a; padding: 24px; text-align: center; }
      #fatal.show { display: grid; }
      #fatal button { font: inherit; padding: 12px 20px; margin-top: 16px; min-height: 44px; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game" aria-label="Kalimah Maze game canvas"></canvas></div>
    <div id="fatal" role="alert"><div><p id="fatal-msg">Terjadi kesalahan.</p><button id="fatal-reload" type="button">Muat ulang</button></div></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
